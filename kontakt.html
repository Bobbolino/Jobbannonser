<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kontakt</title>

    <link rel="stylesheet" href="kontakt.css" />
    <script src="kontakt.js" defer></script>
  </head>

  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Start</a></li>
          <li><a href="annonser.html">Sök jobb</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="contactcard">
        <section class="contact">
          <h2>Kontakta oss</h2>

          <hr />
          <br />
          <form>
            <label for="name">För- och efternamn</label>
            <input type="text" id="name" name="name" />

            <label for="email">E-post</label>
            <input type="email" id="email" name="email" />

            <label for="message">Meddelande</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Skicka</button>
          </form>
        </section>

        <section class="adress">
          <h2>Våra kontaktuppgifter</h2>

          <hr />
          <br />

          <p><strong>JobbMatch Sverige AB</strong></p>
          <p>Karriärvägen 8</p>
          <p>113 45 Stockholm</p>

          <br />

          <p>Telefon: 08-410 82 300</p>
          <p>E-post: kontakt@jobbmatch.se</p>

          <br />

          <p>Öppettider: Mån–Fre 08:00–17:00</p>
        </section>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 JobbMatch Sverige AB</p>
      <p>Kontakt: kontakt@jobbmatch.se</p>
    </footer>
  </body>
</html>
